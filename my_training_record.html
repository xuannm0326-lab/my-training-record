<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的训练记录</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#17202a}
.container{max-width:720px;margin:auto;padding:18px}
h1{margin:8px 0 4px;font-size:30px}
.sub{color:#6b7280;margin-bottom:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;color:#6b7280;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:80px;resize:vertical}
.full{grid-column:1/-1}
button{border:0;border-radius:11px;padding:12px 15px;font-size:15px;cursor:pointer}
.primary{width:100%;background:#111827;color:white;margin-top:14px}
.secondary{background:#eef0f3;color:#222}
.danger{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f7f8fa;border-radius:12px;padding:13px}
.stat b{display:block;font-size:22px;margin-top:5px}
.record{border-top:1px solid #eee;padding:14px 0}
.record:first-child{border-top:0}
.record-head{display:flex;justify-content:space-between;gap:10px}
.muted{color:#6b7280;font-size:13px}
.empty{text-align:center;color:#9ca3af;padding:20px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
@media(max-width:500px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="container">
  <h1>我的训练记录</h1>
  <div class="sub">记录每一次训练，长期看到自己的变化。</div>

  <div class="card">
    <h2>记录今天训练</h2>
    <div class="grid">
      <div>
        <label>日期</label>
        <input id="date" type="date">
      </div>
      <div>
        <label>跑量（公里）</label>
        <input id="distance" type="number" step="0.1" min="0" placeholder="例如 10">
      </div>
      <div>
        <label>训练类型</label>
        <select id="type">
          <option>耐力跑</option>
          <option>速度训练</option>
          <option>间歇训练</option>
          <option>力量训练</option>
          <option>恢复跑</option>
          <option>比赛</option>
          <option>其他</option>
        </select>
      </div>
      <div>
        <label>训练时长（分钟）</label>
        <input id="duration" type="number" min="0" placeholder="例如 60">
      </div>
      <div class="full">
        <label>备注</label>
        <textarea id="note" placeholder="例如：5×1000m，状态良好"></textarea>
      </div>
    </div>
    <button class="primary" onclick="addRecord()">保存训练记录</button>
  </div>

  <div class="card">
    <h2>训练统计</h2>
    <div class="stats">
      <div class="stat"><span class="muted">累计跑量</span><b id="total">0 km</b></div>
      <div class="stat"><span class="muted">训练次数</span><b id="count">0</b></div>
      <div class="stat"><span class="muted">平均跑量</span><b id="avg">0 km</b></div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 style="margin:0">历史记录</h2>
      <button class="secondary" onclick="exportData()">导出数据</button>
    </div>
    <div id="records"></div>
  </div>

  <div class="card">
    <div class="actions">
      <button class="danger" onclick="clearAll()">清空全部记录</button>
    </div>
    <div class="muted" style="margin-top:10px">数据默认保存在这台设备的浏览器中，不会自动上传到服务器。</div>
  </div>
</div>

<script>
const KEY="training_records_v1";
let records=JSON.parse(localStorage.getItem(KEY)||"[]");
document.getElementById("date").value=new Date().toISOString().slice(0,10);

function save(){localStorage.setItem(KEY,JSON.stringify(records));render();}
function addRecord(){
  const date=document.getElementById("date").value;
  const distance=Number(document.getElementById("distance").value||0);
  const type=document.getElementById("type").value;
  const duration=Number(document.getElementById("duration").value||0);
  const note=document.getElementById("note").value.trim();
  if(!date){alert("请选择日期");return}
  if(distance<=0 && duration<=0){alert("至少填写跑量或训练时长");return}
  records.unshift({id:Date.now(),date,distance,type,duration,note});
  save();
  document.getElementById("distance").value="";
  document.getElementById("duration").value="";
  document.getElementById("note").value="";
  alert("训练记录已保存");
}
function del(id){
  records=records.filter(x=>x.id!==id);save();
}
function render(){
  const total=records.reduce((s,x)=>s+x.distance,0);
  document.getElementById("total").textContent=total.toFixed(1)+" km";
  document.getElementById("count").textContent=records.length;
  document.getElementById("avg").textContent=(records.length?(total/records.length):0).toFixed(1)+" km";
  const box=document.getElementById("records");
  if(!records.length){box.innerHTML='<div class="empty">还没有训练记录</div>';return}
  box.innerHTML=records.map(x=>`
    <div class="record">
      <div class="record-head"><strong>${x.date} · ${x.type}</strong><span>${x.distance?x.distance+" km":"—"}</span></div>
      <div class="muted" style="margin-top:5px">${x.duration?x.duration+" 分钟":""}${x.note?" · "+escapeHtml(x.note):""}</div>
      <div class="actions"><button class="danger" onclick="del(${x.id})">删除</button></div>
    </div>`).join("");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function exportData(){
  const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="我的训练记录.json";a.click();
  URL.revokeObjectURL(a.href);
}
function clearAll(){
  if(confirm("确定清空全部训练记录吗？此操作不可恢复。")){records=[];save();}
}
render();
</script>
</body>
</html>
